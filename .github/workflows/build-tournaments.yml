# 大会デッキ(タスク#14)のデータ自動更新。
# 日次で公式Omnidex APIをスキャンし、新しく確定した主要大会を data/tournaments/ に取り込んで
# 静的ページを再生成し、変更があればmainへ直接pushする(Cloudflare Pagesの自動デプロイが続く)。
# 設計: docs/design/14-大会入賞デッキ検索/大会入賞デッキ検索_設計.md
name: build-tournaments

on:
  # 初回バックフィル(420大会 / 10,569デッキ)は 2026-07-22 にmainへ反映済み。
  # 容量の懸念は解消済み(生成HTMLは圧縮が効き、リポジトリ実増加は約11MB)。
  schedule:
    # 毎日 03:37 JST(イベント作成は世界全体で約115件/日のため日次で十分)。
    # 毎時0分は GitHub 側が混むので避ける(#147 W3)。
    - cron: "37 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-tournaments
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 大会スキャン → ページ生成。カードスナップショット(tmp/はgit管理外)は
      # スクリプトが未取得時に公式APIから自動で取り直す。
      - name: 大会データをスキャンしてページ生成
        run: node scripts/build-tournament-pages.mjs

      # カードページ・セットページ・sitemap.xml を再生成する(tournaments/ のURLもここで合流)。
      # 生成物はすべて下の git add 対象(#30)。sitemapだけをコミットしていた頃は、
      # 新セット追加日にsitemapが存在しないカードページを指して404になっていた。
      # data/featured-sets.json は公式APIの応答の保存先で、取得失敗時のフォールバック用
      # (取得できた日だけ更新される。詳細は build-card-pages.mjs の loadFeaturedSets)。
      - name: カード・セットページと sitemap.xml を再生成
        run: node scripts/build-card-pages.mjs

      # 日本語検索の取得前フィルタ用メタ索引(#29)。禁止改定・再録で索引が腐ると
      # 該当カードが黙って候補から落ちるため、日次で鮮度を回復させる。
      # 先行ステップが取得済みのスナップショット(tmp/)に相乗りするので追加は22リクエストのみ。
      # ⚠ continue-on-error は必須。この生成は個別APIリクエストを伴い1件でも落ちると exit 1 するため、
      #   job失敗にすると後段のコミットステップに到達せずその日の大会データごと巻き添えで失われる。
      #   失敗した日は索引が更新されないだけ(差分が出ないのでコミットは通常どおり進む)で、翌日回復する。
      - name: 日本語検索メタ索引を再生成
        run: node scripts/gen-card-meta-index.mjs
        continue-on-error: true

      - name: 変更があればコミット・push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # index.html はトップの静的セットリンク(#37)の生成先。新セットが出た日に自動で載るよう
          # ここに含める(手書きだとPRDスポイラー等の最も需要が高い日に載り漏れる)。
          # ⚠ ルート直下のトップページがcronの自動publish対象に入る。マーカー欠落は
          #   build-card-pages.mjs が exit 1 で落とし、npm run validate も検査する(#37 設計書 §4.4/§4.5)。
          # ⚠ この git add の対象を増減したら、README.md「大会データの自動更新」節と
          #   CLAUDE.md「cronがコミットする範囲」の列挙も直すこと(#70)。npm run validate が
          #   3箇所を集合比較しており、食い違うと exit 1 する。
          git add data/tournaments tournaments sitemap.xml cards sets data/card-meta-index.json data/featured-sets.json index.html
          if git diff --cached --quiet; then
            echo "更新なし(新しく確定した大会はありませんでした)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # スキャン位置(index.json の updatedAt・scan)しか変わらない日はコミットしない(#147 W1)。
          # 7日に1回だけは位置を保存する。判定は scripts/cron-commit-decision.mjs(理由は stderr に出る)。
          # ⚠ 判定が落ちた・想定外の出力のときは commit に倒す(fail-safe。旧来の挙動に戻るだけ)。
          decision=$(node scripts/cron-commit-decision.mjs) || decision=commit
          echo "判定: ${decision}"
          if [ "$decision" = "skip" ]; then
            echo "スキャン位置だけの更新のためコミットしません"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "大会データ自動更新 $(date -u +%Y-%m-%d)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow(#38): 上でpushした分の変更ページだけをBing系へ通知する。
      # ⚠ Googleは IndexNow 非対応なので、これはBing/DuckDuckGo/Ecosia 等にのみ効く。
      # ⚠ continue-on-error は付けない。403/422 は恒久的な設定ミスなので握り潰さない。
      #   例外は UserForbiddedToAccessSite の403のみ(#62)。これは #38 の既知事象で、
      #   スクリプト側が警告に留めて exit 0 する(host が *.pages.dev のときだけ)。
      #   一時的事象(429・ネットワーク例外)もスクリプト側が吸収する。
      # ⚠ 403 は「キーの誤り」の信号ではない(#62 §2-2 の実測)。キーファイルの健全性は
      #   スクリプトが送信直前に自分で取得して確かめる。
      # ⚠ if: は必須。コミットが無かった日に HEAD~1 HEAD を取ると、無関係な前回のコミットの
      #   差分を再送信してしまう。
      - name: 更新URLを IndexNow へ通知
        if: steps.commit.outputs.committed == 'true'
        run: node scripts/indexnow-submit.mjs HEAD~1 HEAD

      # 手で足す辞書(meta.sets / meta.subtypes / meta.rarities)の抜け等を検出する(#147 W4)。
      # ⚠ 公開(コミット・push・IndexNow)の後＝ジョブの最後に置く。前段に置くと、新セット当日に
      #   その日の大会データの取り込みごと止まる。
      # ⚠ continue-on-error は付けない。落ちたらジョブが赤くなり、所有者へメールで知らせる。
      #   赤を見たら、どのステップが落ちたかを開くこと(IndexNow か validate か)。
      - name: データ検証(npm run validate)
        run: npm run validate
