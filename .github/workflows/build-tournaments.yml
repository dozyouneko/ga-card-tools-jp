# 大会デッキ(タスク#14)のデータ自動更新。
# 日次で公式Omnidex APIをスキャンし、新しく確定した主要大会を data/tournaments/ に取り込んで
# 静的ページを再生成し、変更があればmainへ直接pushする(Cloudflare Pagesの自動デプロイが続く)。
# 設計: docs/design/14-大会入賞デッキ検索/大会入賞デッキ検索_設計.md
name: build-tournaments

on:
  # 初回バックフィル(420大会 / 10,569デッキ)は 2026-07-22 にmainへ反映済み。
  # 容量の懸念は解消済み(生成HTMLは圧縮が効き、リポジトリ実増加は約11MB)。
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST(イベント作成は世界全体で約115件/日のため日次で十分)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-tournaments
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 大会スキャン → ページ生成。カードスナップショット(tmp/はgit管理外)は
      # スクリプトが未取得時に公式APIから自動で取り直す。
      - name: 大会データをスキャンしてページ生成
        run: node scripts/build-tournament-pages.mjs

      # カードページ・セットページ・sitemap.xml を再生成する(tournaments/ のURLもここで合流)。
      # 生成物はすべて下の git add 対象(#30)。sitemapだけをコミットしていた頃は、
      # 新セット追加日にsitemapが存在しないカードページを指して404になっていた。
      # data/featured-sets.json は公式APIの応答の保存先で、取得失敗時のフォールバック用
      # (取得できた日だけ更新される。詳細は build-card-pages.mjs の loadFeaturedSets)。
      - name: カード・セットページと sitemap.xml を再生成
        run: node scripts/build-card-pages.mjs

      # 日本語検索の取得前フィルタ用メタ索引(#29)。禁止改定・再録で索引が腐ると
      # 該当カードが黙って候補から落ちるため、日次で鮮度を回復させる。
      # 先行ステップが取得済みのスナップショット(tmp/)に相乗りするので追加は22リクエストのみ。
      # ⚠ continue-on-error は必須。この生成は個別APIリクエストを伴い1件でも落ちると exit 1 するため、
      #   job失敗にすると後段のコミットステップに到達せずその日の大会データごと巻き添えで失われる。
      #   失敗した日は索引が更新されないだけ(差分が出ないのでコミットは通常どおり進む)で、翌日回復する。
      - name: 日本語検索メタ索引を再生成
        run: node scripts/gen-card-meta-index.mjs
        continue-on-error: true

      - name: 変更があればコミット・push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournaments tournaments sitemap.xml cards sets data/card-meta-index.json data/featured-sets.json
          if git diff --cached --quiet; then
            echo "更新なし(新しく確定した大会はありませんでした)"
          else
            git commit -m "大会データ自動更新 $(date -u +%Y-%m-%d)"
            git push
          fi
