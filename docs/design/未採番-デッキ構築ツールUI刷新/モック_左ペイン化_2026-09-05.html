<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ⚠️ 設計検討用のモック。本番の配信対象ではない（docs/ 配下は functions/docs/[[path]].js が404を返す）。
     検討メモ: 検討メモ_左ペイン化Q1-Q6_2026-09-05.md ／ 起票案: 起票案_2026-09-04_デッキ構築ツールの左ペイン化と検索条件の統一.md

     ⭐ 目的は Q2（omnidex提出用コピー等 3ボタンの置き場）を決めること。
        3案（ペイン最下部／ペイン最上部／移さない）を切り替えて比較する。

     ⭐ 実物（/tools/deck-builder/）を取ってきて iframe で動かす方式。コピーを持たないので本体から陳腐化しない。
        ⚠️ デッキ構築ツールは Discord ログインが前提なので、
           <base> と スタブ（モック_左ペイン化_2026-09-05.stub.js）を差し込んだ srcdoc として読み込み、
           /api/me と /api/decks/<id> だけを差し替えて編集画面から始める。
           カードデータ・絵柄・日本語名は本物（api.gatcg.com と data/*.json）。

     ⚠️ ローカルサーバー（⭐ PORT=3000 npm run dev。3000 以外は devcontainer の forwardPorts に無く
        ブラウザから届かない）から
        /docs/design/未採番-デッキ構築ツールUI刷新/モック_左ペイン化_2026-09-05.html で開くこと。
        file:// で開くと同一オリジンにならない。 -->
<title>モック：デッキ構築の左ペイン化（Q2）</title>
<link rel="stylesheet" href="モック_左ペイン化_2026-09-05.css">
</head>
<body>

<div class="panel">
  <h1><span class="tag">モック</span>デッキ構築ツールの左ペイン化 — <b>Q2：omnidex提出用コピー等 3ボタンの置き場</b><button id="panel-toggle" class="mini" type="button">▲ 操作パネルを畳む</button></h1>
  <p class="lead">
    下の枠は<b>実物のデッキ構築ツール</b>（実データのデッキ／カード名・絵柄・チップは本物）。
    ⭐ <b>まず決めたいのは「Q2」の3択</b>です。ほかのつまみは判断材料用。
  </p>

  <div class="rows">
    <div class="grp prime">
      <span class="lbl">⭐ Q2</span>
      <div class="seg" data-g="q2">
        <button data-v="bottom" class="on">案1：ペイン最下部（推奨）</button>
        <button data-v="top">案2：ペイン最上部</button>
        <button data-v="stay">案3：移さない</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">レイアウト</span>
      <div class="seg" data-g="layout">
        <button data-v="now">現状（上部バー）</button>
        <button data-v="pane" class="on">左ペイン化（案Z′）</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">並べ方</span>
      <div class="seg" data-g="compare">
        <button data-v="one" class="on">1枚</button>
        <button data-v="two">現状と並べる</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Q4 並び替え</span>
      <div class="seg" data-g="sort">
        <button data-v="modal">結果モーダル内（現状）</button>
        <button data-v="pane" class="on">左ペインへ移す</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">画面幅</span>
      <div class="seg" data-g="vw">
        <button data-v="1280x900" class="on">1280（境界）</button>
        <button data-v="1279x900">1279（直下）</button>
        <button data-v="1366x768">1366</button>
        <button data-v="1440x900">1440</button>
        <button data-v="1920x1080">1920</button>
        <button data-v="375x812">375</button>
        <button data-v="full">フル</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">表示倍率</span>
      <div class="seg" data-g="zoom">
        <button data-v="1" class="on">100%</button>
        <button data-v="0.75">75%</button>
        <button data-v="0.5">50%</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">デッキ</span>
      <div class="seg" data-g="deck">
        <button data-v="std" class="on">スタンダード（実データ）</button>
        <button data-v="pan">パンテオン（5ゾーン）</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">デッキ名</span>
      <div class="seg" data-g="name">
        <button data-v="normal" class="on">通常（13文字）</button>
        <button data-v="long">最長（36文字）</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">最悪ケース</span>
      <div class="seg">
        <button id="worst-subtype" type="button">サブタイプ157種を開く</button>
        <button id="worst-all" type="button">4群すべて開く＋すべて表示</button>
        <button id="measure" type="button">🔎 実測する</button>
        <button id="reload" type="button">再読込</button>
      </div>
    </div>
  </div>

  <p class="note" id="note"></p>
  <p class="measure" id="measure-out" hidden></p>
</div>

<div class="stage" id="stage">
  <div class="frame-col" id="col-a" hidden>
    <span class="col-tag">現状（変更なし）</span>
    <div class="frame-wrap" id="wrap-a"><iframe id="frame-a" title="デッキ構築ツール（現状）"></iframe></div>
  </div>
  <div class="frame-col" id="col-b">
    <span class="col-tag" id="tag-b">変更後</span>
    <div class="frame-wrap" id="wrap-b"><iframe id="frame-b" title="デッキ構築ツール（変更後）"></iframe></div>
  </div>
</div>

<script src="モック_左ペイン化_2026-09-05.js"></script>
</body>
</html>
