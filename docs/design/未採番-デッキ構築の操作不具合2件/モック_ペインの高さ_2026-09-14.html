<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ⚠️ 設計検討用のモック。本番の配信対象ではない（docs/ 配下は functions/docs/[[path]].js が404を返す）。
     設計書: 操作不具合2件_設計.md §4（不具合2：左ペインの🔍検索が押せない）

     ⭐ 目的は「不具合2をどう直すか」の3案（案1〜案3）を、現状と並べて見比べて決めること。

     ⭐ 実物（/tools/deck-builder/）を iframe で動かす方式（コピーを持たないので本体から陳腐化しない）。
        ⚠️ デッキ構築ツールは Discord ログインが前提なので、<base> とスタブ
           （../未採番-デッキ構築ツールUI刷新/モック_左ペイン化_2026-09-05.stub.js）を差し込んだ srcdoc として読み込む。
        ⭐ 候補の変更は CSSOM の insertRule と、iframe の window へのリスナー追加だけで作る
           （⚠️ <style> 注入は CSP style-src 'self' に阻まれて無言で無視される）。

     ⚠️ PORT=3000 npm run dev で上げ、
        http://localhost:3000/docs/design/未採番-デッキ構築の操作不具合2件/モック_ペインの高さ_2026-09-14.html で開く
        （3000 以外は devcontainer の forwardPorts に無く、コンテナ外のブラウザから届かない）。 -->
<title>モック：左ペインの高さ（🔍検索が押せない件）</title>
<link rel="stylesheet" href="モック_ペインの高さ_2026-09-14.css">
</head>
<body>

<div class="panel">
  <h1><span class="tag">モック</span>不具合2：左ペインの🔍検索が画面の下に隠れて押せない — 3案の見比べ</h1>
  <p class="lead">
    左＝<b>現状</b>／右＝<b>選んだ案</b>。どちらも<b>実物</b>（ログイン済みでデッキを開いた状態）。
    ⭐ <b>再現手順</b>：「①ページ最上部へ」→「②🔍検索（fire）」→「③エレメントを開く」。
    ⚠️ 現状は <b>🔍検索の行が画面の下に隠れ、結果ダイアログが開いている間はページを下へ送れない</b>。
    ⭐ そのあと<b>枠の中を自分でスクロール</b>して、ボタンがどう動くかを見てください。
  </p>

  <div class="rows">
    <div class="grp prime">
      <span class="lbl">⭐ 右の枠の案</span>
      <div class="seg" data-g="plan">
        <button data-v="p1" class="on">案1：ペインの高さを実際の位置に追従（推奨）</button>
        <button data-v="p2">案2：結果ダイアログ中もページをスクロールできるようにする</button>
        <button data-v="p3">案3：ペインを常にヘッダぶん短くする</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">画面サイズ</span>
      <div class="seg" data-g="vw">
        <button data-v="1440x900" class="on">1440×900</button>
        <button data-v="1536x730">1536×730（Windows 125%相当）</button>
        <button data-v="1280x720">1280×720</button>
        <button data-v="1200x800">⭐ 1200×800（境界）</button>
        <button data-v="1920x1080">1920×1080</button>
        <button data-v="1199x800">1199×800（スマホ表示）</button>
        <button data-v="375x812">375×812</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">デッキ名</span>
      <div class="seg" data-g="name">
        <button data-v="normal" class="on">通常</button>
        <button data-v="long">最長（1200pxでバーが2行）</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">表示倍率</span>
      <div class="seg" data-g="zoom">
        <button data-v="0.5">50%</button>
        <button data-v="0.75" class="on">75%</button>
        <button data-v="1">100%</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">操作（両方の枠に同時）</span>
      <div class="seg">
        <button data-act="top" type="button">① ページ最上部へ</button>
        <button data-act="y60" type="button">ページを60px下へ</button>
        <button data-act="y400" type="button">ページを400px下へ</button>
        <button data-act="search" type="button">② 🔍検索（fire）</button>
        <button data-act="element" type="button">③ エレメントを開く</button>
        <button data-act="subtype" type="button">サブタイプ157種をすべて表示</button>
        <button data-act="measure" type="button">🔎 実測する</button>
        <button data-act="reload" type="button">再読込</button>
      </div>
    </div>
  </div>
  <p class="note" id="note"></p>
  <p class="measure" id="measure-out" hidden></p>
</div>

<div class="stage">
  <div class="col">
    <span class="col-tag">現状</span>
    <div class="frame-box" id="box-cur"><iframe id="frame-cur" title="現状"></iframe></div>
  </div>
  <div class="col">
    <span class="col-tag" id="tag-new">案1</span>
    <div class="frame-box" id="box-new"><iframe id="frame-new" title="変更後（案）"></iframe></div>
  </div>
</div>

<script src="モック_ペインの高さ_2026-09-14.js"></script>
</body>
</html>
